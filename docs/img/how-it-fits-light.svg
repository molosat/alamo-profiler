<text x="246" y="73" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">EaW / Forces of Corruption, 64-bit</text>
