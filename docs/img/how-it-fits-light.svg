<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 668" width="780" height="668" role="img" aria-label="The game calls the profiler d3d9.dll, which times the calls, forwards them unchanged to Direct3D and writes CSV logs that analyze.py summarises.">
