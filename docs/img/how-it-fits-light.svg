<text x="140" y="162" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#57606a" text-anchor="start">Alamo Profiler, beside the game</text>
