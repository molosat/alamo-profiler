; Alamo Profiler settings. Copy next to d3d9.dll in the game folder.
; Every key is optional; the values below are the defaults.
[alamo_profiler]
; 0 = pure pass-through (no hooks, no files). Useful for overhead A/B runs.
Enabled=1
; 0 = disable the frame CSV while keeping hooks and the session log enabled.
FramesCsv=1
; GPU timestamp queries -> gpu_ms column.
GpuTiming=1
; Time every Draw* call -> draw_ms column. Costs two clock reads per draw.
DrawTiming=1
; Frames between CSV flushes. Lower = less lost on a crash, more disk writes.
FlushEvery=120
; Frames between memory samples written to the _memory.csv sidecar
; (private bytes, largest free address block). 0 = off.
MemoryEvery=60
; Virtual-key code that bumps the marks column (0x7A = F11, 0 = off).
MarkerKey=0x7A
; Where CSVs and session logs go. Relative paths are relative to this folder.
OutputDir=perf_logs
; Forward to another d3d9 wrapper (ReShade, DXVK, ...) instead of the system
; d3d9.dll. Rename that wrapper, e.g. to d3d9_next.dll, and name it here.
ChainLoad=
